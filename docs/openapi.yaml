openapi: 3.0.3
info:
  title: Simple User API12
  description: API для управления пользователями
  version: 1.0.0
  license:
    name: Not Licensed
    url: https://example.com/license 
  contact:
    name: API Support
    email: support@example.com
servers:
  - url: https://localhost:8080/api
    description: Локальный сервер разработки
  - url: https://api.example.com/v1
    description: Production serv

paths:
  /users:
    get:
      summary: Получить список всех пользователей
      description: Возвращает массив пользователей с основной информацией
      operationId: getUsers
      responses:
        '200':
          description: Успешный ответ — список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Создать нового пользователя
      description: Добавляет нового пользователя в систему
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверные данные для создания пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 123
        name:
          type: string
          example: "Иван Иванов"
        email:
          type: string
          format: email
          example: "ivan@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2023-01-15T10:30:00Z"

    UserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          maxLength: 100
          description: Полное имя пользователя
        email:
          type: string
          format: email
          description: Email пользователя

    Error:
      type: object
      properties:
        code:
          type: string
          description: Код ошибки
        message:
          type: string
          description: Человеко‑читаемое описание ошибки
